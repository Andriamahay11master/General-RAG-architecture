<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Document Assistant</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="page-shell">
      <header class="page-header">
        <div class="page-brand">
          <span class="page-icon">📄</span>
          <div>
            <h1 class="page-title">AI Document Assistant</h1>
            <p class="page-description">
              Ask questions about your document and receive instant,
              context-aware answers.
            </p>
          </div>
        </div>
      </header>

      <main class="chat-container" id="main-content">
        <section class="chat-panel" aria-label="Chat conversation">
          <div
            id="chat-box"
            class="chat-box"
            role="log"
            aria-live="polite"
            aria-relevant="additions"
          ></div>
        </section>

        <section class="chat-input-panel">
          <form id="chat-form" class="chat-form">
            <label for="question-input" class="chat-label">Your question</label>
            <textarea
              id="question-input"
              name="question"
              rows="3"
              placeholder="Ask something about the document..."
              required
            ></textarea>
            <button type="submit" class="chat-button">Send</button>
          </form>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      const form = document.getElementById("chat-form");
      const textarea = document.getElementById("question-input");
      const chatBox = document.getElementById("chat-box");

      textarea.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          form.dispatchEvent(
            new Event("submit", { cancelable: true, bubbles: true }),
          );
        }
      });

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const question = textarea.value.trim();
        if (!question) return;

        addMessage(question, "user");
        textarea.value = "";

        const thinkingMsg = addMessage("Thinking...", "bot");

        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        const data = await res.json();
        typeWriter(thinkingMsg, data.answer, 15);
      });

      function addMessage(text, sender) {
        const message = document.createElement("article");
        message.classList.add("message", sender);
        message.innerText = text;
        chatBox.appendChild(message);
        chatBox.scrollTop = chatBox.scrollHeight;
        return message;
      }

      function typeWriter(element, text, speed = 15) {
        element.innerHTML = "";
        let i = 0;
        const cursor = document.createElement("span");
        cursor.classList.add("cursor");
        cursor.textContent = "|";
        element.appendChild(cursor);

        function typing() {
          if (i < text.length) {
            cursor.insertAdjacentText("beforebegin", text.charAt(i));
            i++;
            chatBox.scrollTop = chatBox.scrollHeight;
            setTimeout(typing, speed);
          } else {
            cursor.remove();
            element.innerHTML = marked.parse(text);
          }
        }

        typing();
      }
    </script>
  </body>
</html>
